[package]
name = "p2game"
description = "POSTAL 2 game host: boots the original compiled UnrealScript from the user's install on the uscript VM"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
upkg.workspace = true
uscript = { path = "../uscript" }
p2nav = { path = "../p2nav" }
p2anim = { path = "../p2anim" }
glam = "0.32"
# Sound, movies, matinee, saves, ragdolls (mosquito's subsystems; see audio.rs, cinema.rs, save.rs, ragdoll.rs).
p2sound = { path = "../p2sound", default-features = false }
p2movie = { path = "../p2movie", default-features = false }
p2matinee = { path = "../p2matinee" }
p2save = { path = "../p2save" }
# Actor physics (duck's physics.rs).
p2physics = { path = "../p2physics" }
p2collide = { path = "../p2collide" }
p2view = { path = "../p2view", optional = true }
# HUD / menus / input (ram's ui.rs).
p2canvas = { path = "../p2canvas", optional = true }
p2input = { path = "../p2input", features = ["bevy"], optional = true }
bevy = { version = "0.19", optional = true }
# Particles, fluids, projector decals (rooster's fx_glue.rs).
p2fx = { path = "../p2fx", optional = true }
# Global allocator of the p2game binary: the interpreter's many short-lived mixed-size
# allocations degrade the Windows system heap (see examples/tick_bench.rs).
mimalloc = { version = "0.1", default-features = false }

[features]
default = ["window"]
# Windowed mode (Bevy + p2view). Build with --no-default-features for a headless-only binary.
window = ["dep:p2view", "dep:bevy", "dep:p2fx", "p2sound/device", "dep:p2canvas", "dep:p2input"]
# Chrome-trace spans for every Bevy system and render phase (writes trace-*.json in the cwd).
# Build with `--features trace` into a separate target dir; open the file in ui.perfetto.dev.
trace = ["window", "bevy/trace_chrome"]

[dev-dependencies]
