[package]
name = "p2magicka"
description = "Magicka rewrite gameplay hosted inside Postal 2"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
magicka-runtime = { path = "../../../rust-bevy-magicka/output/rewrite/crates/magicka-runtime" }
magicka-sim = { path = "../../../rust-bevy-magicka/output/rewrite/crates/magicka-sim" }
magicka-content = { path = "../../../rust-bevy-magicka/output/rewrite/crates/magicka-content" }

magicka-xnb = { path = "../../../rust-bevy-magicka/output/rewrite/crates/magicka-xnb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
